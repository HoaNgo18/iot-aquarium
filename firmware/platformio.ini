[platformio]
default_envs = esp32-fake

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
build_flags = -Wall -Wextra

[env:esp32-fake]
build_flags = ${env.build_flags} -DAQUARIUM_FAKE_SENSORS=1

[env:esp32-sensors]
build_flags = ${env.build_flags} -DAQUARIUM_FAKE_SENSORS=0
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0

[env:esp32-ph-bench]
extends = env:esp32-sensors
build_flags = ${env:esp32-sensors.build_flags} -DAQUARIUM_PH_BENCH=1

; Compatibility alias for the previous environment name.
[env:esp32-pending-sensors]
extends = env:esp32-sensors

# Compile-only TLS variants. config.tls-build.h contains placeholders and must
# never be flashed; these environments prove the ESP-IDF 4.4 SSL fields compile.
[env:esp32-fake-tls]
extends = env:esp32-fake
build_flags = ${env:esp32-fake.build_flags} -DAQUARIUM_TLS_BUILD_TEST=1

[env:esp32-sensors-tls]
extends = env:esp32-sensors
build_flags = ${env:esp32-sensors.build_flags} -DAQUARIUM_TLS_BUILD_TEST=1

# Compile-only Cloudflare Tunnel WSS variants. They use ESP-IDF's complete
# certificate bundle and config.wss-build.h placeholders.
[env:esp32-fake-wss]
extends = env:esp32-fake
build_flags = ${env:esp32-fake.build_flags} -DAQUARIUM_WSS_BUILD_TEST=1

[env:esp32-sensors-wss]
extends = env:esp32-sensors
build_flags = ${env:esp32-sensors.build_flags} -DAQUARIUM_WSS_BUILD_TEST=1
